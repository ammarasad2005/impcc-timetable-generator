# Render Blueprint — deploy the CP-SAT backend as a free web service.
# In the Render dashboard: New + → Blueprint → connect GitHub → pick this repo.
# Render reads this file and creates the service below automatically.

services:
  - type: web
    name: impcc-cp-sat
    runtime: docker            # builds the Dockerfile at the repo root
    plan: free                 # free tier (512 MB RAM, 0.1 vCPU, sleeps after 15 min idle)
    healthCheckPath: /health
    envVars:
      - key: CP_SAT_WORKERS
        value: "4"             # fewer solver threads for the low-CPU free tier
      - key: PYTHONUNBUFFERED
        value: "1"
